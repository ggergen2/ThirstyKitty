<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Person Matcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #16213e;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.8rem;
      color: #e94560;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tab-bar button {
      flex: 1;
      padding: 10px;
      border: 2px solid #e94560;
      background: transparent;
      color: #e94560;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-bar button.active {
      background: #e94560;
      color: #fff;
    }
    .tab-bar button:hover:not(.active) {
      background: rgba(233, 69, 96, 0.15);
    }
    .section { display: none; }
    .section.active { display: block; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f3460;
      color: #eee;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #e94560; }
    button.action {
      width: 100%;
      padding: 12px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.action:hover { background: #c73a52; }
    .message {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .message.success { background: rgba(39, 174, 96, 0.2); border: 1px solid #27ae60; }
    .message.error { background: rgba(233, 69, 96, 0.2); border: 1px solid #e94560; }
    .message.info { background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; }
    .match-name {
      font-size: 1.6rem;
      color: #2ecc71;
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }
    .welcome-banner {
      background: rgba(52, 152, 219, 0.15);
      border: 1px solid #3498db;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .welcome-banner .name {
      color: #3498db;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .welcome-banner .status {
      color: #888;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .logout-link {
      color: #e94560;
      cursor: pointer;
      font-size: 0.8rem;
      text-decoration: underline;
      margin-top: 6px;
      display: inline-block;
    }
    .people-count {
      text-align: center;
      color: #888;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Random Person Matcher</h1>
    <p class="subtitle">Join the pool, get matched, check your pairing privately</p>

    <!-- Shown when user is recognized -->
    <div id="welcome" style="display:none;">
      <div class="welcome-banner">
        <div class="name" id="welcome-name"></div>
        <div class="status" id="welcome-status"></div>
        <span class="logout-link" onclick="logout()">Not you? Switch person</span>
      </div>
      <div id="match-result"></div>
    </div>

    <!-- Shown when no user is cached -->
    <div id="join-section">
      <label for="join-name">Your Name</label>
      <input type="text" id="join-name" placeholder="Enter your name to join">
      <button class="action" onclick="joinPool()">Join the Pool</button>
      <div id="join-message"></div>
    </div>

    <!-- Admin toggle -->
    <div style="margin-top: 24px; text-align: center;">
      <span class="logout-link" onclick="toggleAdmin()" id="admin-toggle-link">Admin</span>
    </div>

    <div id="admin-section" style="display:none; margin-top: 16px;">
      <label for="admin-pass">Admin Password</label>
      <input type="password" id="admin-pass" placeholder="Enter admin password">
      <button class="action" id="admin-login-btn" onclick="adminLogin()">Login</button>
      <div id="admin-controls" style="display:none;">
        <p class="people-count" id="pool-count"></p>
        <button class="action" onclick="runMatching()" style="margin-bottom:12px;">Run Matching</button>
        <button class="action" onclick="resetPool()" style="background:#e67e22;">Reset All</button>
      </div>
      <div id="admin-message"></div>
    </div>
  </div>

  <script>
    const POOL_KEY = 'matcher_pool';
    const USER_KEY = 'matcher_my_id';
    const ADMIN_PASS = 'matcher2024';

    function generateId() {
      return crypto.getRandomValues(new Uint8Array(16)).reduce((s, b) => s + b.toString(16).padStart(2, '0'), '');
    }

    function getPool() {
      try {
        const raw = localStorage.getItem(POOL_KEY);
        if (!raw) return { people: {}, matches: {}, matched: false };
        return JSON.parse(raw);
      } catch { return { people: {}, matches: {}, matched: false }; }
    }

    function savePool(pool) {
      localStorage.setItem(POOL_KEY, JSON.stringify(pool));
    }

    function getMyId() {
      try { return localStorage.getItem(USER_KEY); } catch { return null; }
    }

    function setMyId(id) {
      try { localStorage.setItem(USER_KEY, id); } catch {}
    }

    function clearMyId() {
      try { localStorage.removeItem(USER_KEY); } catch {}
    }

    function showMessage(elementId, text, type) {
      const el = document.getElementById(elementId);
      el.className = 'message ' + type;
      el.innerHTML = text;
    }

    // --- Render the right view ---
    function render() {
      const myId = getMyId();
      const pool = getPool();
      const me = myId ? pool.people[myId] : null;

      if (me) {
        document.getElementById('join-section').style.display = 'none';
        document.getElementById('welcome').style.display = 'block';
        document.getElementById('welcome-name').textContent = me.name;

        if (pool.matched) {
          const myMatch = pool.matches[myId];
          if (myMatch) {
            document.getElementById('welcome-status').textContent = 'You have a match!';
            document.getElementById('match-result').innerHTML =
              `<div class="message success">Your match is:<span class="match-name">${myMatch}</span></div>`;
          } else {
            document.getElementById('welcome-status').textContent = 'Odd number of people — you\'ll be in the next round.';
            document.getElementById('match-result').innerHTML =
              `<div class="message info">You weren't paired this round (odd number). Try next round!</div>`;
          }
        } else {
          document.getElementById('welcome-status').textContent = 'You\'re in the pool. Waiting for matching...';
          document.getElementById('match-result').innerHTML =
            `<div class="message info">Hang tight! The admin hasn't run the matching yet. Come back and check anytime.</div>`;
        }
      } else {
        document.getElementById('join-section').style.display = 'block';
        document.getElementById('welcome').style.display = 'none';
      }
    }

    function joinPool() {
      const name = document.getElementById('join-name').value.trim();
      if (!name) {
        showMessage('join-message', 'Please enter your name.', 'error');
        return;
      }

      const pool = getPool();

      if (pool.matched) {
        showMessage('join-message', 'Matching has already been done. Ask the admin to reset for a new round.', 'error');
        return;
      }

      const nameLower = name.toLowerCase();
      const existingId = Object.keys(pool.people).find(id => pool.people[id].name.toLowerCase() === nameLower);
      if (existingId) {
        showMessage('join-message', `"${name}" is already in the pool. If that's you on a new device, ask the admin.`, 'error');
        return;
      }

      const id = generateId();
      pool.people[id] = { name };
      savePool(pool);
      setMyId(id);

      document.getElementById('join-name').value = '';
      render();
    }

    function logout() {
      clearMyId();
      document.getElementById('join-message').innerHTML = '';
      render();
    }

    // --- Admin ---
    function toggleAdmin() {
      const sec = document.getElementById('admin-section');
      sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    }

    function adminLogin() {
      if (document.getElementById('admin-pass').value === ADMIN_PASS) {
        document.getElementById('admin-controls').style.display = 'block';
        document.getElementById('admin-pass').style.display = 'none';
        document.getElementById('admin-login-btn').style.display = 'none';
        updatePoolCount();
        showMessage('admin-message', 'Logged in as admin.', 'success');
      } else {
        showMessage('admin-message', 'Wrong password.', 'error');
      }
    }

    function updatePoolCount() {
      const pool = getPool();
      const count = Object.keys(pool.people).length;
      const status = pool.matched ? ' (matched)' : ' (waiting)';
      document.getElementById('pool-count').textContent = `${count} people in the pool${status}`;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function runMatching() {
      const pool = getPool();
      const ids = Object.keys(pool.people);
      if (ids.length < 2) {
        showMessage('admin-message', 'Need at least 2 people to match.', 'error');
        return;
      }

      const shuffled = shuffle(ids);
      pool.matches = {};

      for (let i = 0; i < shuffled.length - 1; i += 2) {
        pool.matches[shuffled[i]] = pool.people[shuffled[i + 1]].name;
        pool.matches[shuffled[i + 1]] = pool.people[shuffled[i]].name;
      }

      pool.matched = true;
      savePool(pool);
      updatePoolCount();
      render();

      const pairs = Math.floor(shuffled.length / 2);
      const odd = shuffled.length % 2 ? ' (1 person left unmatched)' : '';
      showMessage('admin-message', `Matched ${pairs} pairs!${odd}`, 'success');
    }

    function resetPool() {
      if (!confirm('Reset everything? All people and matches will be cleared.')) return;
      savePool({ people: {}, matches: {}, matched: false });
      clearMyId();
      updatePoolCount();
      render();
      showMessage('admin-message', 'Pool has been reset.', 'success');
    }

    render();
  </script>
</body>
</html>
