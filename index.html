<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Person Matcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #16213e;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.8rem;
      color: #e94560;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tab-bar button {
      flex: 1;
      padding: 10px;
      border: 2px solid #e94560;
      background: transparent;
      color: #e94560;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-bar button.active {
      background: #e94560;
      color: #fff;
    }
    .tab-bar button:hover:not(.active) {
      background: rgba(233, 69, 96, 0.15);
    }
    .section { display: none; }
    .section.active { display: block; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f3460;
      color: #eee;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #e94560; }
    button.action {
      width: 100%;
      padding: 12px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.action:hover { background: #c73a52; }
    button.action:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .message.success { background: rgba(39, 174, 96, 0.2); border: 1px solid #27ae60; }
    .message.error { background: rgba(233, 69, 96, 0.2); border: 1px solid #e94560; }
    .message.info { background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; }
    .match-name {
      font-size: 1.4rem;
      color: #2ecc71;
      font-weight: bold;
    }
    .people-count {
      text-align: center;
      color: #888;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Random Person Matcher</h1>
    <p class="subtitle">Join the pool, get matched, check your pairing privately</p>

    <div class="tab-bar">
      <button class="active" data-tab="join">Join</button>
      <button data-tab="check">Check Match</button>
      <button data-tab="admin">Admin</button>
    </div>

    <div id="join-section" class="section active">
      <label for="join-name">Your Name</label>
      <input type="text" id="join-name" placeholder="Enter your name">
      <label for="join-pass">Choose a Password</label>
      <input type="password" id="join-pass" placeholder="Pick a password you'll remember">
      <button class="action" onclick="joinPool()">Join the Pool</button>
      <div id="join-message"></div>
    </div>

    <div id="check-section" class="section">
      <label for="check-name">Your Name</label>
      <input type="text" id="check-name" placeholder="Enter your name">
      <label for="check-pass">Your Password</label>
      <input type="password" id="check-pass" placeholder="Enter your password">
      <button class="action" onclick="checkMatch()">Check My Match</button>
      <div id="check-message"></div>
    </div>

    <div id="admin-section" class="section">
      <label for="admin-pass">Admin Password</label>
      <input type="password" id="admin-pass" placeholder="Enter admin password">
      <button class="action" id="admin-login-btn" onclick="adminLogin()">Login</button>
      <div id="admin-controls" style="display:none;">
        <p class="people-count" id="pool-count"></p>
        <button class="action" onclick="runMatching()" style="margin-bottom:12px;">Run Matching</button>
        <button class="action" onclick="resetPool()" style="background:#e67e22;">Reset All</button>
      </div>
      <div id="admin-message"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'random_matcher_data';
    const ADMIN_PASS = 'matcher2024';

    // --- Hashing ---
    async function hashStr(str) {
      const data = new TextEncoder().encode(str);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // --- Simple XOR encrypt/decrypt with a key (not cryptographically strong, but hides plaintext from casual browsing) ---
    function xorEncrypt(text, key) {
      let result = '';
      for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return btoa(result);
    }

    function xorDecrypt(encoded, key) {
      const text = atob(encoded);
      let result = '';
      for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return result;
    }

    // --- Data ---
    function getData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { people: [], matches: {}, matched: false };
      try { return JSON.parse(raw); } catch { return { people: [], matches: {}, matched: false }; }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // --- Tabs ---
    document.querySelectorAll('.tab-bar button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
        document.getElementById(tab + '-section').classList.add('active');
        btn.classList.add('active');
      });
    });

    function showMessage(elementId, text, type) {
      const el = document.getElementById(elementId);
      el.className = 'message ' + type;
      el.innerHTML = text;
    }

    // --- Join ---
    async function joinPool() {
      const name = document.getElementById('join-name').value.trim();
      const pass = document.getElementById('join-pass').value;

      if (!name) { showMessage('join-message', 'Please enter your name.', 'error'); return; }
      if (!pass || pass.length < 3) { showMessage('join-message', 'Password must be at least 3 characters.', 'error'); return; }

      const nameKey = name.toLowerCase();
      const nameHash = await hashStr(nameKey);
      const passHash = await hashStr(nameKey + ':' + pass);

      const data = getData();

      if (data.people.find(p => p.nameHash === nameHash)) {
        showMessage('join-message', `The name "<strong>${name}</strong>" is already taken. If that's you, go to Check Match to see your pairing.`, 'info');
        return;
      }

      if (data.matched) {
        showMessage('join-message', 'Matching has already been done. Ask the admin to reset for a new round.', 'error');
        return;
      }

      data.people.push({ nameHash, passHash, displayName: name });
      saveData(data);

      document.getElementById('join-name').value = '';
      document.getElementById('join-pass').value = '';
      showMessage('join-message',
        `Welcome, <strong>${name}</strong>! You're in the pool.<br><br>Remember your name and password to check your match later. Only you can see who you're paired with.`,
        'success');
    }

    // --- Check match ---
    async function checkMatch() {
      const name = document.getElementById('check-name').value.trim();
      const pass = document.getElementById('check-pass').value;

      if (!name || !pass) { showMessage('check-message', 'Please enter your name and password.', 'error'); return; }

      const nameKey = name.toLowerCase();
      const nameHash = await hashStr(nameKey);
      const passHash = await hashStr(nameKey + ':' + pass);

      const data = getData();
      const person = data.people.find(p => p.nameHash === nameHash);

      if (!person) {
        showMessage('check-message', 'Name not found. Did you join the pool first?', 'error');
        return;
      }

      if (person.passHash !== passHash) {
        showMessage('check-message', 'Wrong password. Try again.', 'error');
        return;
      }

      if (!data.matched) {
        showMessage('check-message',
          `Hi <strong>${person.displayName}</strong>! Matching hasn't been done yet. Check back later.`,
          'info');
        return;
      }

      const encryptedMatch = data.matches[nameHash];
      if (!encryptedMatch) {
        showMessage('check-message',
          `Hi <strong>${person.displayName}</strong>! You weren't included in this round (odd number of people). Try next round!`,
          'info');
        return;
      }

      const matchName = xorDecrypt(encryptedMatch, passHash);

      showMessage('check-message',
        `Hi <strong>${person.displayName}</strong>! Your match is:<br><br><span class="match-name">${matchName}</span>`,
        'success');
    }

    // --- Admin ---
    function adminLogin() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('admin-controls').style.display = 'block';
        document.getElementById('admin-pass').style.display = 'none';
        document.getElementById('admin-login-btn').style.display = 'none';
        updatePoolCount();
        showMessage('admin-message', 'Logged in as admin.', 'success');
      } else {
        showMessage('admin-message', 'Wrong password.', 'error');
      }
    }

    function updatePoolCount() {
      const data = getData();
      const status = data.matched ? ' (matched)' : ' (waiting)';
      document.getElementById('pool-count').textContent =
        `${data.people.length} people in the pool${status}`;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function runMatching() {
      const data = getData();
      if (data.people.length < 2) {
        showMessage('admin-message', 'Need at least 2 people to match.', 'error');
        return;
      }

      const shuffled = shuffle(data.people);
      data.matches = {};

      for (let i = 0; i < shuffled.length - 1; i += 2) {
        const a = shuffled[i];
        const b = shuffled[i + 1];
        data.matches[a.nameHash] = xorEncrypt(b.displayName, a.passHash);
        data.matches[b.nameHash] = xorEncrypt(a.displayName, b.passHash);
      }

      data.matched = true;
      saveData(data);
      updatePoolCount();
      showMessage('admin-message',
        `Matched ${Math.floor(shuffled.length / 2)} pairs!${shuffled.length % 2 ? ' (1 person left unmatched — odd number)' : ''}`,
        'success');
    }

    function resetPool() {
      if (!confirm('Reset everything? All people and matches will be cleared.')) return;
      saveData({ people: [], matches: {}, matched: false });
      updatePoolCount();
      showMessage('admin-message', 'Pool has been reset. Ready for new round.', 'success');
    }
  </script>
</body>
</html>
